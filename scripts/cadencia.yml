# Cadência do agente.
# Cada perfil ativo gera entries no crontab do container (gerados pelo entrypoint).
# Documentação em SPEC §2.3 e §4.2 da plataforma Semente.

profiles:
  responsive:
    enabled: false                   # saturno é sweep-only; modo task-driven desligado
    crons:
      - "*/5 9-19 * * 1-5"           # comercial: 5min
      - "*/30 0-8,20-23 * * 1-5"     # off-hours dias úteis
      - "*/30 * * * 0,6"             # fim de semana
    timezone: America/Sao_Paulo
    rotina: null
    list_filter:
      status: [pending, in_progress]
    max_turns_per_workspace: 50

  daily:
    enabled: false                   # saturno é sweep-only
    crons:
      - "0 8 * * 1-5"                # 08:00 dias úteis
    timezone: America/Sao_Paulo
    rotina: rotina-matinal.md
    list_filter:
      status: [pending, in_progress]
      scope: today
    max_turns_per_workspace: 80

  urgent_only:
    enabled: false
    crons:
      - "*/15 * * * *"
    timezone: America/Sao_Paulo
    rotina: null
    list_filter:
      status: [pending]
      scheduleMode: urgente
    max_turns_per_workspace: 30

  batch:
    enabled: false
    crons:
      - "0 */2 * * *"
    timezone: America/Sao_Paulo
    rotina: null
    list_filter:
      status: [pending, in_progress]
    max_turns_per_workspace: 80

  # Modo sweep (project-driven) — usado pelo agente auditor (saturno).
  # Diferente dos perfis acima: work-list = projetos (workspace-map.json), nao fila Bloquim.
  # Roda via tick-sweep.sh (campo runner). Desligado no template/mercurio; saturno liga.
  sweep:
    enabled: true                    # perfil ativo do saturno (auditor)
    runner: tick-sweep.sh
    crons:                           # ponderado: auditor não precisa de latência de 10min
      - "*/15 9-19 * * 1-5"          # comercial: 15min
      - "*/45 0-8,20-23 * * 1-5"     # off-hours dias úteis: 45min
      - "*/45 * * * 0,6"             # fim de semana: 45min
    timezone: America/Sao_Paulo
    model: claude-haiku-4-5-20251001 # R1 é rule-following → Haiku (~3-5x mais barato que Sonnet)
    max_turns_per_workspace: 20      # R1 c/ LID→tel + resolução de identidade por msg estoura 12 (error_max_turns em sweep-104/292, 2026-06-16); 20 dá folga, runaway barrado pelo cost cap
    # Slim de tools: só o que as regras usam (~49 MCP tools → ~16). Corta ~7-10k tok/turn.
    # Built-ins + tools do R1 (+ headroom p/ regras de cobrança/destrave próximas).
    allowed_tools:
      - Bash
      - Read
      - Write
      - Edit
      - mcp__platform__inbox_list_unread
      - mcp__platform__inbox_mark_read
      - mcp__platform__resolve_whatsapp_identity
      - mcp__platform__send_whatsapp_dm
      - mcp__bloquim__create_task
      - mcp__bloquim__search_tasks
      - mcp__bloquim__list_workspace_tasks
      - mcp__bloquim__list_workspace_members
      - mcp__bloquim__get_task
      - mcp__bloquim__add_task_comment
      - mcp__bloquim__set_task_status
      - mcp__bloquim__set_task_schedule

# Guardrails de custo. Soft cap — degradação graciosa antes do hard cap do Anthropic.
# Saturno (auditor, 1 projeto, Haiku, tools slim): perfil enxuto.
guardrails:
  cost_cap_usd_per_day: 1.50
  cost_cap_usd_per_tick: 0.12
  alert_threshold_pct: 80
